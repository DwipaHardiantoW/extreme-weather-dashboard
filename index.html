<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extreme Weather Dashboard</title>
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>
<style>
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
  #map { height: 100%; width: 100%; }
  .popup-dummy { color: orange; font-weight: bold; }
  .popup-bmkg { color: red; font-weight: bold; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// URL Worker yang menyajikan KV
const DATA_URL = 'https://extreme-weather-dashboard.bmkgupdate.workers.dev/';

// Format waktu jadi lebih mudah dibaca
function formatTime(timeStr) {
  if (!timeStr) return '-';
  const d = new Date(timeStr);
  return d.toLocaleString('id-ID', { hour12: false });
}

// Inisialisasi peta
const map = L.map('map').setView([-2.5, 118], 5);

// Tile layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Ambil data dari KV
fetch(DATA_URL)
  .then(res => res.json())
  .then(data => {
    data.forEach(city => {
      const coords = city.coords;
      let popupContent = `<b>${city.city}</b><br>Region: ${city.region}<br>`;

      if (city.latest_warning) {
        const src = city.latest_warning.source || 'BMKG';
        const typeClass = src === 'DUMMY' ? 'popup-dummy' : 'popup-bmkg';
        popupContent += `<span class="${typeClass}">Type: ${city.latest_warning.type} (${src})</span><br>`;
        popupContent += `Time: ${formatTime(city.latest_warning.start_time)} - ${formatTime(city.latest_warning.end_time)}<br>`;
        popupContent += `Description: ${city.latest_warning.description}`;
      } else {
        popupContent += 'No active warning';
      }

      L.marker(coords).addTo(map).bindPopup(popupContent);
    });
  })
  .catch(err => console.error('Error loading data:', err));
</script>
</body>
</html>
