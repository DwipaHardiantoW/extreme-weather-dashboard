<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extreme Weather Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    #map { height: 100vh; width: 100vw; }
    .legend {
      background: white;
      padding: 6px 10px;
      line-height: 18px;
      color: #333;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-2.5, 118], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // URL Worker KV
    const DATA_URL = 'https://extreme-weather-dashboard.bmkgupdate.workers.dev/';

    function getMarkerColor(warning) {
      if (!warning) return 'blue'; // no current warning
      if (warning.isDummy) return 'orange'; // dummy warning
      return 'red'; // BMKG warning
    }

    function createMarker(cityData) {
      const warning = cityData.latest_warning;
      const color = getMarkerColor(warning);

      const marker = L.circleMarker(cityData.coords, {
        radius: 8,
        color: color,
        fillColor: color,
        fillOpacity: 0.8,
        weight: 1
      }).addTo(map);

      let tooltipText = `<b>${cityData.city}</b><br>`;
      if (!warning) tooltipText += 'No current warning';
      else {
        tooltipText += `Type: ${warning.type}<br>`;
        tooltipText += `Description: ${warning.description}<br>`;
        tooltipText += `Start: ${warning.start_time}<br>`;
        tooltipText += `End: ${warning.end_time}<br>`;
        tooltipText += `Source: ${warning.source}`;
      }
      marker.bindPopup(tooltipText);
    }

    async function loadData() {
      try {
        const resp = await fetch(DATA_URL);
        const data = await resp.json();
        data.forEach(createMarker);
      } catch (err) {
        console.error('Failed to load data', err);
      }
    }

    loadData();

    // Legend
    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <i style="background:red"></i> BMKG warning<br>
        <i style="background:orange"></i> Dummy warning<br>
        <i style="background:blue"></i> No current warning
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
