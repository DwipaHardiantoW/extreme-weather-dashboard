<script>
const WORKER_ENDPOINT = "https://extreme-weather-dashboard.bmkgupdate.workers.dev/";

const map = L.map("map").setView([-2.5, 118], 5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "© OpenStreetMap"
}).addTo(map);

const colorForWarning = w => {
  if(!w) return "blue"; // no warning
  return w.isDummy ? "orange" : "red";
}

  try {
    const resp = await fetch(WORKER_ENDPOINT);
    const data = await resp.json();
