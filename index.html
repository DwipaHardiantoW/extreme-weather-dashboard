<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BMKG Extreme Weather Dashboard</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .popup-content { font-size: 14px; line-height: 1.4; }
    .popup-content b { display: inline-block; width: 80px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-2.5, 118], 5); // center Indonesia

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const WORKER_URL = 'https://extreme-weather-dashboard.bmkgupdate.workers.dev/'; // ganti sesuai Worker mu

    async function loadWarnings() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();

        data.forEach(item => {
          const { coords, city, region, latest_warning } = item;
          if (!coords) return;

          const marker = L.marker(coords).addTo(map);

          let popupHtml = `<div class="popup-content">
            <b>City:</b> ${city}<br>
            <b>Region:</b> ${region}<br>`;

          if (latest_warning) {
            popupHtml += `
            <b>Type:</b> ${latest_warning.type}<br>
            <b>Time:</b> ${latest_warning.start_time} - ${latest_warning.end_time}<br>
            <b>Description:</b> ${latest_warning.description}<br>`;
          } else {
            popupHtml += `<b>Status:</b> No current warning`;
          }

          popupHtml += '</div>';

          marker.bindPopup(popupHtml);
        });

      } catch (err) {
        console.error('Failed to load warnings:', err);
      }
    }

    loadWarnings();

    // Optional: refresh every 10 minutes
    setInterval(loadWarnings, 10 * 60 * 1000);
  </script>
</body>
</html>
