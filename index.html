<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extreme Weather Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body { margin:0; padding:0; height:100%; }
    #map { width:100%; height:100%; }
    /* Popup styling */
    .popup-content { font-family: Arial, sans-serif; font-size: 14px; }
    .popup-content h4 { margin: 0 0 5px 0; }
    .popup-content p { margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Initialize map
    const map = L.map('map').setView([-2.5, 118], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Marker colors based on warning type
    function getMarkerColor(type) {
      switch(type) {
        case 'Banjir': return 'blue';
        case 'Angin Kencang': return 'red';
        default: return 'green';
      }
    }

    // Format time to readable string
    function formatTime(datetime) {
      const d = new Date(datetime);
      return d.toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
    }

    // Load markers from Worker
    async function loadMarkers() {
      try {
        const resp = await fetch('https://extreme-weather-dashboard.bmkgupdate.workers.dev'); // ganti URL Worker
        const data = await resp.json();

        data.forEach(city => {
          if (city.latest_warning) {
            const color = getMarkerColor(city.latest_warning.type);

            const marker = L.circleMarker(city.coords, {
              radius: 8,
              fillColor: color,
              color: '#000',
              weight: 1,
              opacity: 1,
              fillOpacity: 0.8
            }).addTo(map);

            // Bind popup with structured info
            const typeColor = color;
            const popupContent = `
              <div class="popup-content">
                <h4>${city.city}</h4>
                <p><b>Region:</b> ${city.region}</p>
                <p><b>Type:</b> <span style="color:${typeColor};">${city.latest_warning.type}</span></p>
                <p><b>Time:</b> ${formatTime(city.latest_warning.start_time)} - ${formatTime(city.latest_warning.end_time)}</p>
                <p><b>Description:</b> ${city.latest_warning.description}</p>
              </div>
            `;
            marker.bindPopup(popupContent);
          }
        });

      } catch (err) {
        console.error('Error loading markers:', err);
        alert('Failed to load weather warnings. Check console.');
      }
    }

    loadMarkers();
  </script>
</body>
</html>
