<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extreme Weather Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { height: 100%; width: 100%; }
    .popup-content { font-family: sans-serif; font-size: 14px; }
    .popup-content b { display: block; margin-bottom: 3px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-2.5, 118], 5); // Indonesia center
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Ambil data dari Worker KV
    fetch('https://extreme-weather-dashboard.bmkgupdate.workers.dev/')
      .then(res => res.json())
      .then(data => {
        data.forEach(place => {
          const warning = place.latest_warning;

          // Tentukan warna marker
          let color = 'gray';
          if (warning) {
            color = warning.source === "BMKG" ? 'red' :
                    warning.source === "DUMMY" ? 'blue' : 'gray';
          }

          const marker = L.circleMarker(place.coords, {
            radius: 8,
            fillColor: color,
            color: '#000',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          }).addTo(map);

          let popupContent = `<div class="popup-content">
            <b>${place.city}, ${place.region}</b>`;

          if (warning) {
            popupContent += `
              <b>Source:</b> ${warning.source}<br/>
              <b>Type:</b> ${warning.type}<br/>
              <b>Start:</b> ${warning.start_time}<br/>
              <b>End:</b> ${warning.end_time}<br/>
              <b>Description:</b> ${warning.description}`;
          } else {
            popupContent += `<i>No current warning</i>`;
          }

          popupContent += `</div>`;
          marker.bindPopup(popupContent);
        });
      })
      .catch(err => console.error('Fetch error:', err));
  </script>
</body>
</html>
