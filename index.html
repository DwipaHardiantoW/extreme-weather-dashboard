<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extreme Weather Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100vw; }
    .popup-bmkg { color: red; }
    .popup-dummy { color: blue; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const API_URL = 'https://extreme-weather-dashboard.bmkgupdate.workers.dev/';

    // Inisialisasi map
    const map = L.map('map').setView([-2.5, 118], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Fetch data dari Worker KV
    async function loadWarnings() {
      try {
        const resp = await fetch(API_URL);
        const data = await resp.json();

        data.forEach(markerData => {
          const coords = markerData.coords;
          const latest = markerData.latest_warning;

          const color = latest ? (latest.source === "BMKG" ? "red" : "blue") : "gray";

          const marker = L.circleMarker(coords, {
            radius: 8,
            fillColor: color,
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          }).addTo(map);

          const info = latest
            ? `<strong>${markerData.city}</strong><br>
               Region: ${markerData.region}<br>
               Type: ${latest.type}<br>
               Time: ${latest.start_time} - ${latest.end_time}<br>
               Description: ${latest.description}<br>
               <em>Source: ${latest.source}</em>`
            : `<strong>${markerData.city}</strong><br>No current warning`;

          marker.bindPopup(info);
        });

      } catch (err) {
        console.error('Error fetching warnings:', err);
      }
    }

    loadWarnings();

    // Optional: refresh tiap 10 menit
    setInterval(loadWarnings, 10 * 60 * 1000);
  </script>
</body>
</html>
