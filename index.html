<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extreme Weather Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .popup-content { font-family: Arial, sans-serif; font-size: 14px; }
    .source-badge { font-weight: bold; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@2.31.0/esm/index.js"></script>
  <script type="module">
    import { format, parseISO } from 'https://cdn.jsdelivr.net/npm/date-fns@2.31.0/esm/index.js';

    const map = L.map('map').setView([-2.5, 118], 5); // Center Indonesia

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    async function fetchWarnings() {
      try {
        const resp = await fetch('https://extreme-weather-dashboard.bmkgupdate.workers.dev/');
        const data = await resp.json();
        renderMarkers(data);
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function renderMarkers(data) {
      data.forEach(city => {
        const warning = city.latest_warning;
        let color = 'blue';
        let popupHTML = `<div class="popup-content"><b>${city.city}</b> - ${city.region}<br>No current warning</div>`;

        if (warning) {
          color = warning.isDummy ? 'orange' : 'red';
          const start = warning.start_time ? format(parseISO(warning.start_time), 'dd MMM yyyy HH:mm') : '-';
          const end = warning.end_time ? format(parseISO(warning.end_time), 'dd MMM yyyy HH:mm') : '-';
          popupHTML = `
            <div class="popup-content">
              <b>${city.city}</b> - ${city.region}<br>
              <b>Type:</b> ${warning.type}<br>
              <b>Start:</b> ${start}<br>
              <b>End:</b> ${end}<br>
              <b>Description:</b> ${warning.description}<br>
              <span class="source-badge">${warning.source}</span>
            </div>
          `;
        }

        L.circleMarker(city.coords, {
          radius: 8,
          fillColor: color,
          color: '#000',
          weight: 1,
          opacity: 1,
          fillOpacity: 0.8
        }).addTo(map)
          .bindPopup(popupHTML);
      });
    }

    fetchWarnings();

    // Optional: auto-refresh setiap 10 menit
    setInterval(fetchWarnings, 10 * 60 * 1000);
  </script>
</body>
</html>
