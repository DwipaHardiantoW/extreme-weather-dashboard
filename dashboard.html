<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extreme Weather Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body, html { margin:0; padding:0; height:100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-2.5, 118], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(map);

    // Fungsi warna marker berdasarkan tipe peringatan
    function getMarkerColor(type) {
      switch(type) {
        case 'Banjir': return 'blue';
        case 'Angin Kencang': return 'red';
        default: return 'green';
      }
    }

    async function loadMarkers() {
      try {
        const resp = await fetch('https://extreme-weather-dashboard.bmkgupdate.workers.dev'); // ganti URL Worker
        const data = await resp.json();

        data.forEach(city => {
          if (city.latest_warning) {
            const color = getMarkerColor(city.latest_warning.type);
            const marker = L.circleMarker(city.coords, {
              radius: 8,
              fillColor: color,
              color: '#000',
              weight: 1,
              opacity: 1,
              fillOpacity: 0.8
            }).addTo(map);

            marker.bindPopup(`
              <b>${city.city}</b><br>
              Region: ${city.region}<br>
              Type: ${city.latest_warning.type}<br>
              Time: ${city.latest_warning.start_time} - ${city.latest_warning.end_time}<br>
              Description: ${city.latest_warning.description}
            `);
          }
        });
      } catch (err) {
        console.error('Error loading markers:', err);
        alert('Failed to load weather warnings. Check console.');
      }
    }

    loadMarkers();
  </script>
</body>
</html>
